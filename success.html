<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - Cocó Catering</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .result-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(232, 201, 173, 0.05);
            padding: 20px;
        }
        
        .result-container {
            background: var(--blanco);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
        }
        
        .result-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease;
        }
        
        .result-icon svg {
            width: 60px;
            height: 60px;
            stroke: white;
            stroke-width: 3;
        }
        
        .result-container h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--negro);
            margin-bottom: 20px;
        }
        
        .result-container p {
            font-size: 1.2rem;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .order-details {
            background: rgba(232, 201, 173, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
            text-align: left;
        }
        
        .order-details h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--bordo);
            margin-bottom: 15px;
        }
        
        .order-details p {
            margin: 8px 0;
            font-size: 1rem;
        }
        
        .btn-home {
            background: var(--bordo);
            color: var(--blanco);
            padding: 15px 40px;
            border-radius: 50px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        
        .btn-home:hover {
            background: var(--negro);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 46, 58, 0.3);
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
    <link rel="icon" href="images/Logo.jpeg" type="image/jpeg">
</head>
<body>
    <div class="result-page">
        <div class="result-container">
            <div class="result-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            
            <h1>¡Pago Exitoso!</h1>
            <p>Tu pedido ha sido confirmado correctamente.</p>
            
            <div class="order-details">
                <h3>Detalles del Pedido</h3>
                <p><strong>Número de orden:</strong> <span id="orderNumber"></span></p>
                <p><strong>Estado:</strong> Aprobado</p>
                <p>Recibirás un email de confirmación con los detalles de tu pedido.</p>
                <p>Te contactaremos pronto para coordinar la entrega.</p>
            </div>
            
            <a href="index.html" class="btn-home">Volver al Inicio</a>
        </div>
    </div>
    
    <script type="module">
        import { decrementCartStock, updateOrderStatus } from './firestore-service.js';
        import { PAGE_TO_COLLECTION } from './firestore-service.js';
        
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment_id');
        const status = urlParams.get('status');
        const externalReference = urlParams.get('external_reference');
        
        // Mostrar número de orden
        if (paymentId) {
            document.getElementById('orderNumber').textContent = paymentId;
        }
        
        // Obtener carrito antes de limpiarlo
        const cartJson = localStorage.getItem('cocoCart');
        const cart = cartJson ? JSON.parse(cartJson) : [];
        
        // Decrementar stock de los productos comprados en Firebase
        if (cart.length > 0 && status === 'approved') {
            try {
                // Preparar items del carrito con información de colección
                const cartItems = cart.map(item => {
                    // Intentar derivar la colección del nombre o ID del producto
                    let collectionName = '';
                    
                    // Mapeo básico según el nombre del producto
                    if (item.name.toLowerCase().includes('box') && item.name.toLowerCase().includes('salado')) {
                        collectionName = 'boxSalados';
                    } else if (item.name.toLowerCase().includes('box') && item.name.toLowerCase().includes('dulce')) {
                        collectionName = 'boxDulces';
                    } else if (item.name.toLowerCase().includes('finger') && item.name.toLowerCase().includes('frío')) {
                        collectionName = 'fingersFrios';
                    } else if (item.name.toLowerCase().includes('finger') && item.name.toLowerCase().includes('caliente')) {
                        collectionName = 'fingersCalientes';
                    } else if (item.name.toLowerCase().includes('shot')) {
                        collectionName = 'shots';
                    } else if (item.name.toLowerCase().includes('torta') && item.name.toLowerCase().includes('clásica')) {
                        collectionName = 'tortasClasicas';
                    } else if (item.name.toLowerCase().includes('combo')) {
                        collectionName = 'combosDulces';
                    } else if (item.name.toLowerCase().includes('desayuno')) {
                        collectionName = 'desayunos';
                    } else if (item.name.toLowerCase().includes('menú') || item.name.toLowerCase().includes('gourmet') || item.name.toLowerCase().includes('clásico') || item.name.toLowerCase().includes('picada') || item.name.toLowerCase().includes('pizza')) {
                        collectionName = 'menuEventos';
                    }
                    
                    return {
                        collectionName: collectionName,
                        productName: item.name,
                        quantity: item.quantity
                    };
                }).filter(item => item.collectionName); // Filtrar items sin colección
                
                // Decrementar stock en Firebase
                const success = await decrementCartStock(cartItems);
                
                if (success) {
                    console.log('✅ Stock actualizado correctamente en Firebase');
                } else {
                    console.error('❌ Error al actualizar stock en Firebase');
                }
                
                // Actualizar estado de la orden en Firebase si existe
                const firebaseOrderId = localStorage.getItem('firebaseOrderId');
                if (firebaseOrderId) {
                    await updateOrderStatus(firebaseOrderId, 'completed');
                    console.log('✅ Estado de orden actualizado en Firebase');
                }
                
            } catch (error) {
                console.error('Error al decrementar stock:', error);
            }
        }
        
        // Limpiar carrito después de compra exitosa
        localStorage.removeItem('cocoCart');
        
        // Enviar email con los detalles de la orden
        if (paymentId && status === 'approved') {
            // Obtener datos del comprador de localStorage
            const orderDataJson = localStorage.getItem('cocoOrder');
            const orderData = orderDataJson ? JSON.parse(orderDataJson) : null;
            
            if (orderData && cart.length > 0) {
                // Calcular total
                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                
                // Preparar datos para email
                const emailData = {
                    customer: orderData.customer,
                    items: cart,
                    total: total,
                    paymentId: paymentId,
                    orderDate: new Date().toLocaleString('es-AR', { 
                        dateStyle: 'full', 
                        timeStyle: 'short' 
                    })
                };
                
                // Detectar URL del backend
                const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
                    ? 'http://localhost:3000' 
                    : window.location.origin;
                
                // Guardar orden en el sistema
                fetch(`${BACKEND_URL}/api/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emailData)
                })
                .then(response => response.json())
                .then(data => {
                    console.log('✅ Orden guardada:', data);
                })
                .catch(err => {
                    console.error('❌ Error al guardar orden:', err);
                });
                
                // Limpiar datos de orden
                localStorage.removeItem('cocoOrder');
            }
        }
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script type="module" src="firebase-config.js"></script>
