            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }
        .log.active {
            display: block;
        }
        .log .success {
            color: #00ff00;
        }
        .log .error {
            color: #ff4444;
        }
        .log .info {
            color: #4da6ff;
        }
        .log .warning {
            color: #ffaa00;
        }
        .progress {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }
        .progress.active {
            display: block;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            font-size: 14px;

        document.getElementById('totalProducts').textContent = products.length;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            logDiv.classList.add('active');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateProgress(current, total) {
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            progress.classList.add('active');
            const percentage = (current / total) * 100;
            progressBar.style.width = percentage + '%';
        }

        window.uploadProducts = async function() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = '? Subiendo...';

            log('?? Iniciando subida de productos...', 'info');
            log(`?? Total de productos a subir: ${products.length}`, 'info');

            let successCount = 0;
            let errorCount = 0;

            for (let i = 0; i < products.length; i++) {
                const product = products[i];
                try {
                    const productData = {
                        id: product.id,
                        name: product.name,
                        image: CDN_BASE + product.image,
                        category: product.category,
                        createdAt: new Date().toISOString()
                    };

                    await setDoc(doc(db, 'products', product.id), productData);
                    successCount++;
                    document.getElementById('successCount').textContent = successCount;
                    log(`? [${i + 1}/${products.length}] ${product.name}`, 'success');
                } catch (error) {
                    errorCount++;
                    document.getElementById('errorCount').textContent = errorCount;
                    log(`? Error en ${product.name}: ${error.message}`, 'error');
                }
                updateProgress(i + 1, products.length);
            }

            log(`\n?? ¡PROCESO COMPLETADO!`, 'success');
            log(`? Exitosos: ${successCount}`, 'success');
            log(`? Errores: ${errorCount}`, 'error');

            btn.disabled = false;
            btn.textContent = '? Subida Completada';
        }

        window.clearFirestore = async function() {
            if (!confirm('?? ¿ESTÁS SEGURO? Esto eliminará TODOS los productos de Firestore.')) {
                return;
            }

            const btn = document.getElementById('clearBtn');
            btn.disabled = true;
            btn.textContent = '? Eliminando...';

            log('??? Iniciando limpieza de Firestore...', 'warning');

            try {
                const querySnapshot = await getDocs(collection(db, 'products'));
                let deleteCount = 0;

                for (const docSnapshot of querySnapshot.docs) {
                    await deleteDoc(doc(db, 'products', docSnapshot.id));
                    deleteCount++;
                    log(`??? Eliminado: ${docSnapshot.id}`, 'warning');
                }

                log(`\n? Limpieza completada. ${deleteCount} documentos eliminados.`, 'success');
            } catch (error) {
                log(`? Error: ${error.message}`, 'error');
            }

            btn.disabled = false;
            btn.textContent = '??? Limpiar Firestore (CUIDADO)';
        }
