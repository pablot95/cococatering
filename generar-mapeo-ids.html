<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Mapeo IDs</title>
</head>
<body>
    <h1>Generador de Mapeo IDs HTML â†’ Firebase</h1>
    <button onclick="generarMapeo()">Generar Mapeo</button>
    <pre id="output" style="background: #f5f5f5; padding: 20px; margin-top: 20px;"></pre>
    <script>
        // FunciÃ³n para limpiar nombre (igual que en subir-productos.html y firebase-product-loader.js)
        function limpiarNombre(nombre) {
            return nombre
                .trim()
                .toUpperCase()
                .replace(/\s+/g, '_')
                .replace(/[^A-Z0-9_-]/g, '');
        }
        // FunciÃ³n para generar data-id desde nombre
        function generarDataId(nombre) {
            return nombre
                .toLowerCase()
                .replace(/\s*(â€“|-)\s*x\d+/gi, '') // Eliminar " â€“ x12", " - x12", etc
                .replace(/\s+de\s+/gi, '-') // "de" -> "-"
                .replace(/\s+y\s+/gi, '-') // "y" -> "-"
                .replace(/\s+con\s+/gi, '-') // "con" -> "-"
                .replace(/\s+/g, '-') // Espacios -> "-"
                .replace(/[^a-z0-9-]/g, ''); // Eliminar caracteres especiales
        }
        async function generarMapeo() {
            const productos = await fetch('productos.json').then(r => r.json());
            const mapeo = {};
            // Procesar cada colecciÃ³n
            for (const [coleccion, items] of Object.entries(productos)) {
                if (coleccion === 'MenúEventos') continue; // Skip MenúÃºs
                console.log(`\n// ${coleccion}`);
                for (const producto of items) {
                    const dataId = generarDataId(producto.nombre);
                    const firebaseId = producto.categoria 
                        ? limpiarNombre(producto.categoria + ' ' + producto.nombre)
                        : limpiarNombre(producto.nombre);
                    mapeo[dataId] = firebaseId;
                    console.log(`'${dataId}': '${firebaseId}',`);
                }
            }
            // Mostrar en pÃgina
            const output = document.getEleMenútById('output');
            output.textContent = 'const MAPEO_IDS = {\n';
            for (const [key, value] of Object.entries(mapeo)) {
                output.textContent += `    '${key}': '${value}',\n`;
            }
            output.textContent += '};';
            console.log('\nâœ… Mapeo generado. Copia el contenido de arriba.');
        }
    </script>
</body>
</html>
