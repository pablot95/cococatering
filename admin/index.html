<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <img src="Logo.jpeg" alt="Cocó Catering" class="login-logo-img" onerror="this.style.display='none'">
      <h1>Cocó Catering</h1>
      <p>Panel de Administración</p>
    </div>
    <form id="loginForm" autocomplete="on" novalidate>
      <div class="field-group">
        <label for="loginEmail">Correo electrónico</label>
        <input type="email" id="loginEmail" placeholder="admin@ejemplo.com" required autocomplete="email">
      </div>
      <div class="field-group">
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div id="loginError" class="login-error hidden"></div>
      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnLoginText">Ingresar</span>
      </button>
      <div style="text-align:center;margin-top:12px">
        <button type="button" id="btnForgotPass" style="background:none;border:none;color:var(--bordo);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">¿Olvidaste tu contraseña?</button>
      </div>
    </form>
    <p class="login-note">Acceso restringido · Solo personal autorizado</p>
  </div>
</div>

<!-- Auto-init flatpickr en español en todos los input[type=date] del DOM -->
<script>
(function () {
  function initFlatpickr(el) {
    if (el._flatpickr) return;
    flatpickr(el, {
      locale: 'es',
      dateFormat: 'Y-m-d',
      altInput: true,
      altFormat: 'd/m/Y',
      allowInput: true,
      defaultDate: el.value || null
    });
  }
  function scanDateInputs(root) {
    (root.querySelectorAll ? root : document).querySelectorAll('input[type="date"]').forEach(initFlatpickr);
  }
  scanDateInputs(document);
  const obs = new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      if (n.matches && n.matches('input[type="date"]')) initFlatpickr(n);
      else scanDateInputs(n);
    }));
  });
  obs.observe(document.body, { childList: true, subtree: true });
})();
</script>
